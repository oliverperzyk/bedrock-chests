# Workflow to verify codebase of every single library & application in the project.
---
name: Validate every single library in the project.
on:
    push:
    pull_request:
permissions:
    contents: read
env:
    BUN_VERSION: latest
jobs:
    validate-root-directory:
        name: Validate root directory.
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
    validate-documentation-application:
        name: Validate documentation application.
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
        defaults:
            run:
                working-directory: packages/docs
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Initialize test environment.
              run: bun run test:init
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of codebase using ESLint.
              run: bun run lint
            - name: Check linting of Dockerfile using Hadolint.
              uses: hadolint/hadolint-action@v3.3.0
              with:
                  dockerfile: packages/docs/Dockerfile
                  config: packages/docs/.hadolint.yaml
            - name: Run tests.
              run: bun run test
            - name: Build production-ready website.
              run: bun run build
              env:
                  NODE_ENV: production
    validate-library:
        name: Validate main library.
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/lib
        env:
            NODE_ENV: test
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of codebase using ESLint.
              run: bun run lint
            - name: Run tests.
              run: bun run test
    validate-resource-pack:
        name: Validate resource pack.
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/resource-pack
        env:
            NODE_ENV: test
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Initialize test environment.
              run: bun run test:init
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of codebase using ESLint.
              run: bun run lint
            - name: Run tests.
              run: bun run test
