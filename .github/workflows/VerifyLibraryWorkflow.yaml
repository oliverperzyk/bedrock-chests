# Workflow to verify the library of the project.
---
name: Verify library.
on:
    push:
        paths:
            - "packages/lib/**"
            - ".github/workflows/verify/VerifyLibraryWorkflow.yaml"
    pull_request:
        paths:
            - "packages/lib/**"
            - ".github/workflows/verify/VerifyLibraryWorkflow.yaml"
permissions:
    contents: read
defaults:
    run:
        working-directory: packages/lib
        shell: bash
jobs:
    verify-library:
        name: Verify library.
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Initialize testing environment.
              run: bun run test:init
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of all files using ESLint.
              run: bun run lint
            - name: Run tests.
              run: bun run test
