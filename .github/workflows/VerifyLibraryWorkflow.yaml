# Workflow to verify the library of the project.
---
name: Verify library.
on:
    workflow_dispatch:
    push:
        paths:
            - "packages/lib/**"
            - ".github/workflows/VerifyLibraryWorkflow.yaml"
    pull_request:
        paths:
            - "packages/lib/**"
            - ".github/workflows/VerifyLibraryWorkflow.yaml"
permissions:
    contents: read
defaults:
    run:
        working-directory: packages/lib
        shell: bash
jobs:
    verify-library:
        name: Verify library.
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            NEXT_PUBLIC_WEBSITE_ENDPOINT_URL: https://bedrock-chests.oliverperzyk.com
            NEXT_PUBLIC_API_ENDPOINT_URL: https://api.bedrock-chests.oliverperzyk.com
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Cache Bun dependencies.
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-lib-${{ hashFiles('packages/lib/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-lib-
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Initialize testing environment.
              run: bun run test:init
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of all files using ESLint.
              run: bun run lint
            - name: Run tests.
              run: bun run test
