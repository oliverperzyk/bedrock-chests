# Configuration for Dependabot to automatically update dependencies in the project.
---
version: 2
updates:
    # Update Bun dependencies in the root directory and all packages.
    - package-ecosystem: bun
      target-branch: development
      directories:
          - /
          - /packages/docs/
          - /packages/lib
          - /packages/resource-pack
      schedule:
          interval: monthly
          timezone: Europe/Warsaw
      open-pull-requests-limit: 40
      labels:
          - "🔄 dependencies"
      commit-message:
          prefix: "chore(bun):"
    # Update GitHub Actions workflows in the root directory and all packages.
    - package-ecosystem: github-actions
      target-branch: development
      directory: /
      schedule:
          interval: monthly
          timezone: Europe/Warsaw
      open-pull-requests-limit: 10
      labels:
          - "🔄 dependencies"
      commit-message:
          prefix: "chore(workflows):"
    # Update Docker image in the documentation application.
    - package-ecosystem: docker
      directory: /packages/docs
      schedule:
          interval: monthly
          timezone: Europe/Warsaw
      open-pull-requests-limit: 10
      labels:
          - "🔄 dependencies"
      commit-message:
          prefix: "chore(docker):"
